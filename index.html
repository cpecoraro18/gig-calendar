<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <meta
      name="description"
      content="A phone-first calendar for gigging musicians: your Google calendars, plus posts for your gigs."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the manifest and reads these instead. black-translucent
         puts the page behind the status bar, which is why the header and the
         + button are already padded with the safe-area insets. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gigs" />

    <!-- Resolves the theme before the first paint, so a phone in light mode
         doesn't flash dark while the bundle loads. src/lib/theme.js owns it
         from then on; the key has to match. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('app.theme') || 'null')
        var light =
          saved === 'light' ||
          (saved !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {}
    </script>

    <title>Gig Calendar</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
